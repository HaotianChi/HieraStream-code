protocol_version: FINAL_V1
result_class: FINAL_V1_CONFIG
dataset: vitaldb
segment_sizes_bytes: [256, 1024, 4096, 16384]
max_events: 6000
fill_gate:
  max_actual_ratio: 0.9
  median_non_tail_ratio: 0.8
note: |
  Segment granularity sweep. max_events must be large enough that each
  target size T yields max(actual_payload) >= 0.9*T (and median non-tail >= 0.8*T).
