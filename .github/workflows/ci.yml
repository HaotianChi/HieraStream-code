name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest (algebraic backend)
        env:
          HIERASTREAM_CRYPTO_BACKEND: algebraic
        run: |
          python -m pytest tests/unit tests/crypto tests/authorization tests/fabric tests/e2e -q

  go:
    name: Go ledger tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: PeerMVCC tests
        working-directory: core/blockchain/peerval
        run: go test ./...
      - name: Chaincode tests
        working-directory: core/blockchain/chaincode/hierastream
        run: go test ./...
